      last_response_options_trigger: "xpath=(//div[@data-screenshot-ignore='true' and contains(@class, 'flex') and contains(@class, 'items-center') and contains(@class, 'md:mt-5')])[last()]"
      health_check_element: "xpath=(//textarea[@id='chat-input' and contains(@class, 'ant-input') and @enterkeyhint='send'])[last()]"


